version: "3.9"

services:
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    restart: unless-stopped

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

    networks:
      - dsa-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: dsa-backend

    restart: unless-stopped

    env_file:
      - ./backend/.env

    ports:
      - "8080:8080"

    depends_on:
      - kafka

    networks:
      - dsa-network

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile

    container_name: dsa-dashboard

    restart: unless-stopped

    env_file:
      - ./dashboard/.env

    ports:
      - "8081:8081"

    depends_on:
      - kafka

    networks:
      - dsa-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: dsa-frontend

    restart: unless-stopped

    ports:
      - "3000:80"

    depends_on:
      - backend

    networks:
      - dsa-network

networks:
  dsa-network:
    driver: bridge
